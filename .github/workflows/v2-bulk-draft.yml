name: ArabicPRM-T v2 local runner checks (offline)
on:
  push:
    branches: [research/arabicprm-v2-production]
    paths:
      - ".github/workflows/v2-bulk-draft.yml"
      - "research/prm_arabic_english/bulk_draft_v2_translations.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            research/prm_arabic_english
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: |
          python -m py_compile research/prm_arabic_english/bulk_draft_v2_translations.py
          python research/prm_arabic_english/bulk_draft_v2_translations.py --help
          python scripts/check_reproducibility.py
