name: ArabicPRM-T v2 translation draft

on:
  push:
    branches:
      - research/arabicprm-t-v2-production
    paths:
      - ".github/workflows/arabicprm-t-v2-translation.yml"
      - "research/prm_arabic_english/draft_translate_arabic_mt.py"
      - "research/prm_arabic_english/test_draft_translate_arabic_mt.py"
      - "research/prm_arabic_english/test_materialize_translation.py"
      - "research/prm_arabic_english/select_arabicprm_t_v2_source.py"
      - "research/prm_arabic_english/materialize_translation_batch.py"
      - "research/prm_arabic_english/render_translation_review.py"
      - "research/prm_arabic_english/export_reviewed_arabic.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: research/prm_arabic_english
      PRM800K_REVISION: 7ecc794703b2877f63226f2477a49b34f9b25163
      PRM800K_SHA256: 1110237feeb51d1bc200cb37b8f965cfdc1036eac7d506094049366fe7dc1089
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Unit tests
        run: |
          python -m unittest research.prm_arabic_english.test_draft_translate_arabic_mt -v
          python -m unittest research.prm_arabic_english.test_select_arabicprm_t_v2_source -v
          python -m unittest research.prm_arabic_english.test_materialize_translation -v
          python -m unittest research.prm_arabic_english.test_reviewed_export -v

      - name: Install local MT dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.8.0" "transformers==4.57.1" "sentencepiece==0.2.1" "sacremoses==0.1.1"
          python -m pip freeze > translation_environment.txt

      - name: Fetch and verify pinned PRM800K shard
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git lfs install
          git clone --filter=blob:none https://github.com/openai/prm800k.git prm800k-source
          git -C prm800k-source checkout "$PRM800K_REVISION"
          git -C prm800k-source lfs pull --include="prm800k/data/phase2_train.jsonl" --exclude=""
          echo "$PRM800K_SHA256  prm800k-source/prm800k/data/phase2_train.jsonl" | sha256sum -c -

      - name: Reconstruct source pool and frozen v2 subset
        run: |
          python research/prm_arabic_english/prm800k_production_sample.py             --input prm800k-source/prm800k/data/phase2_train.jsonl             --expected-sha256 "$PRM800K_SHA256"             --output-dir source_pool             --max-problems 1000             --seed 42             --dev-fraction 0.2             --split-lock research/prm_arabic_english/translation_batches/prm800k_qc24/problem_split_lock.json

          python research/prm_arabic_english/select_arabicprm_t_v2_source.py             --source-dir source_pool             --output-dir arabicprm_t_v2_source             --train-problem-pairs 80             --dev-problem-pairs 20             --seed 42             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc12/source_lock.json             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24/source_lock.json             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24_batch03_r1/source_lock.json

      - name: Generate open-source Arabic MT draft
        run: |
          mkdir translation_assets
          cp arabicprm_t_v2_source/translation_queue/source_lock.json translation_assets/source_lock.json
          python research/prm_arabic_english/draft_translate_arabic_mt.py             --queue-dir arabicprm_t_v2_source/translation_queue             --output translation_assets/translations.json             --model Helsinki-NLP/opus-mt-en-ar             --num-beams 2             --date 2026-10-10

      - name: Materialize and verify draft
        run: |
          python research/prm_arabic_english/materialize_translation_batch.py             --queue-dir arabicprm_t_v2_source/translation_queue             --assets-dir translation_assets             --output-dir arabic_draft

      - name: Create pending human-QC template
        run: |
          python research/prm_arabic_english/export_reviewed_arabic.py             --queue arabic_draft/review_queue.jsonl             --decisions human_qc_pending.json             --output-dir unused_review_export             --make-template

      - name: Render ten 20-record bilingual review pages
        run: |
          mkdir review_pages
          for start in 1 21 41 61 81 101 121 141 161 181; do
            end=$((start + 19))
            args=""
            for n in $(seq "$start" "$end"); do
              args="$args --record-number $n"
            done
            python research/prm_arabic_english/render_translation_review.py               --input arabic_draft/review_queue.jsonl               --output "review_pages/ArabicPRM-T-v2-review-${start}-${end}.html"               --batch-id "ArabicPRM-T-v2-${start}-${end}"               $args
          done

      - name: Emit translation summary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = json.loads(Path("arabicprm_t_v2_source/manifest.json").read_text(encoding="utf-8"))
          report = json.loads(Path("arabic_draft/report.json").read_text(encoding="utf-8"))
          pending = json.loads(Path("human_qc_pending.json").read_text(encoding="utf-8"))
          summary = {
              "source_manifest_sha256": hashlib.sha256(Path("arabicprm_t_v2_source/manifest.json").read_bytes()).hexdigest(),
              "records": report["records"],
              "translated_steps": report["translated_steps"],
              "review_queue_sha256": report["review_queue_sha256"],
              "translation_payload_sha256": report["translation_payload_sha256"],
              "source_lock_sha256": report["source_lock_sha256"],
              "human_qc": report["human_qc"],
              "training_eligible": report["training_eligible"],
              "pending_decisions": sum(r["decision"] == "pending" for r in pending["reviews"]),
              "train_records": source["config"]["train_records"],
              "dev_records": source["config"]["dev_records"],
              "global_mgsm_used": source["global_mgsm_used"],
          }
          Path("translation_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print("ARABICPRM_T_V2_TRANSLATION=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload translation and human-QC package
        uses: actions/upload-artifact@v4
        with:
          name: arabicprm-t-v2-translation-review
          path: |
            arabicprm_t_v2_source/manifest.json
            arabicprm_t_v2_source/translation_queue/manifest.json
            arabicprm_t_v2_source/translation_queue/source_lock.json
            translation_assets/
            arabic_draft/report.json
            arabic_draft/review_queue.jsonl
            human_qc_pending.json
            review_pages/
            translation_summary.json
            translation_environment.txt
          if-no-files-found: error
