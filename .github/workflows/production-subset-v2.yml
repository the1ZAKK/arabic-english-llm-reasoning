name: ArabicPRM-T production subset v2

on:
  push:
    branches:
      - research/production-subset-v2
    paths:
      - ".github/workflows/production-subset-v2.yml"
      - "research/prm_arabic_english/select_production_translation_subset.py"
      - "research/prm_arabic_english/test_select_production_translation_subset.py"
      - "research/prm_arabic_english/prm800k_production_sample.py"
      - "research/prm_arabic_english/source_quarantine.json"
      - "research/prm_arabic_english/translation_batches/**/source_lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: research/prm_arabic_english
      PRM800K_REVISION: 7ecc794703b2877f63226f2477a49b34f9b25163
      PRM800K_SHA256: 1110237feeb51d1bc200cb37b8f965cfdc1036eac7d506094049366fe7dc1089
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Run selector tests
        run: python -m unittest research.prm_arabic_english.test_select_production_translation_subset -v

      - name: Fetch pinned PRM800K shard
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git lfs install
          git clone --filter=blob:none https://github.com/openai/prm800k.git prm800k-source
          git -C prm800k-source checkout "$PRM800K_REVISION"
          git -C prm800k-source lfs pull --include="prm800k/data/phase2_train.jsonl" --exclude=""
          echo "$PRM800K_SHA256  prm800k-source/prm800k/data/phase2_train.jsonl" | sha256sum -c -

      - name: Rebuild checked 1000-problem source pool
        run: |
          python research/prm_arabic_english/prm800k_production_sample.py \
            --input prm800k-source/prm800k/data/phase2_train.jsonl \
            --expected-sha256 "$PRM800K_SHA256" \
            --output-dir source_pool \
            --max-problems 1000 \
            --seed 42 \
            --dev-fraction 0.2 \
            --split-lock research/prm_arabic_english/translation_batches/prm800k_qc24/problem_split_lock.json

      - name: Select balanced/diverse 400-trajectory production subset
        run: |
          python research/prm_arabic_english/select_production_translation_subset.py \
            --source-dir source_pool \
            --output-dir production_subset_v2 \
            --train-count 320 \
            --dev-count 80 \
            --seed 42 \
            --max-per-problem 2 \
            --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc12/source_lock.json \
            --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24/source_lock.json \
            --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24_batch03/source_lock.json

      - name: Print subset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("production_subset_v2/manifest.json").read_text(encoding="utf-8"))
          print("PRODUCTION_SUBSET_V2=" + json.dumps(m, sort_keys=True))
          PY

      - name: Upload frozen translation queue
        uses: actions/upload-artifact@v4
        with:
          name: arabicprm-t-production-subset-v2
          path: production_subset_v2
          if-no-files-found: error
