name: Offline research checks

on:
  push:
    paths:
      - "research/prm_arabic_english/**"
      - "research/*.md"
      - "research/RECOVERY_V2_EVIDENCE.json"
      - "scripts/check_reproducibility.py"
      - ".github/workflows/offline-checks.yml"
  pull_request:
    paths:
      - "research/prm_arabic_english/**"
      - "research/*.md"
      - "research/RECOVERY_V2_EVIDENCE.json"
      - "scripts/check_reproducibility.py"
      - ".github/workflows/offline-checks.yml"
  workflow_dispatch:
    inputs:
      legacy_scheduled_task_checks:
        description: "Explicit opt-in for legacy scheduled-task integration tests (excluded from pilot preparation)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            research/prm_arabic_english
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/check_reproducibility.py
      - name: Parse the Windows launcher without starting inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @("resume_v2_windows.ps1", "install_v2_unattended_windows.ps1", "install_v2_recovery_windows.ps1", "install_pilot_preparation_windows_v1.ps1", "install_pilot_execution_windows_v1.ps1", "install_semantic_recovery_windows_v2.ps1", "install_semantic_recovery_windows_v2_1.ps1")) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$pwd/research/prm_arabic_english/$script",
              [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify separate recovery-v2 offline package without model access or old budget reuse
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          PINNED_SEMANTIC_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_semantic_recovery_windows_v2.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_SEMANTIC_SHA" -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Native offline semantic package failed: $LASTEXITCODE" }
      - name: Verify separate recovery-v2.1 follow-up package with no model or budget access
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          PINNED_FOLLOWUP_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_semantic_recovery_windows_v2_1.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_FOLLOWUP_SHA" -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Native v2.1 follow-up packaging failed: $LASTEXITCODE" }
      - name: Verify offline semantic CMD SHA256 and block a tampered hash before installer execution
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          ARABICPRM_SEMANTIC_VERIFY_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = "$pwd/research/prm_arabic_english/verify_semantic_recovery_windows_v2.cmd"
          $verified = @(& cmd.exe /d /c $launcher 2>&1)
          $verifiedExit = $LASTEXITCODE
          $verified | ForEach-Object { Write-Host $_ }
          if ($verifiedExit -ne 0 -or -not ($verified -match 'SEMANTIC BOOTSTRAP VERIFIED:')) {
            throw "Offline semantic bootstrap verification failed: $verifiedExit"
          }
          $badLauncher = Join-Path $env:TEMP ("ArabicPRM-semantic-bad-hash-" + [guid]::NewGuid().ToString('N') + '.cmd')
          try {
            $original = [IO.File]::ReadAllText($launcher)
            $digest = [regex]::Match($original, '[0-9a-f]{64}').Value
            if (-not $digest) { throw 'Missing pinned offline installer hash' }
            [IO.File]::WriteAllText($badLauncher, $original.Replace($digest, ('0' * 64)), [Text.Encoding]::ASCII)
            $rejected = @(& cmd.exe /d /c $badLauncher 2>&1)
            $rejectedExit = $LASTEXITCODE
            $rejected | ForEach-Object { Write-Host $_ }
            if ($rejectedExit -eq 0 -or ($rejected -match 'SEMANTIC BOOTSTRAP VERIFIED:') -or
                -not ($rejected -match 'Offline semantic installer SHA256 mismatch')) {
              throw 'Incorrect offline semantic hash did not block installer execution'
            }
            Write-Host 'SEMANTIC NEGATIVE HASH CHECK PASSED: nothing executed.'
          } finally {
            Remove-Item -LiteralPath $badLauncher -Force -ErrorAction SilentlyContinue
          }
          exit 0
      - name: Verify separate pilot package without approval, model requests or scheduled tasks
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          PINNED_PILOT_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_pilot_preparation_windows_v1.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_PILOT_SHA" -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Native pilot preparation package failed: $LASTEXITCODE" }
      - name: Verify isolated pilot execution package without consent, inference or tasks
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          PINNED_PILOT_EXECUTION_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_pilot_execution_windows_v1.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_PILOT_EXECUTION_SHA" -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Native pilot execution packaging failed: $LASTEXITCODE" }
      - name: Verify execution pilot launcher SHA256 and block an incorrect hash before installer execution
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          ARABICPRM_PILOT_EXEC_VERIFY_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = "$pwd/research/prm_arabic_english/execute_recovery_pilot20_windows_v1.cmd"
          $verified = @(& cmd.exe /d /c $launcher 2>&1)
          $verifiedExit = $LASTEXITCODE
          $verified | ForEach-Object { Write-Host $_ }
          if ($verifiedExit -ne 0 -or -not ($verified -match 'PILOT EXECUTION BOOTSTRAP VERIFIED:')) {
            throw "Pilot execution bootstrap exact-hash verification failed: $verifiedExit"
          }
          $badLauncher = Join-Path $env:TEMP ("ArabicPRM-pilot-execution-bad-hash-" + [guid]::NewGuid().ToString('N') + '.cmd')
          try {
            $original = [IO.File]::ReadAllText($launcher)
            $digest = [regex]::Match($original, '[0-9a-f]{64}').Value
            if (-not $digest) { throw 'Missing pinned pilot execution installer hash' }
            [IO.File]::WriteAllText($badLauncher, $original.Replace($digest, ('0' * 64)), [Text.Encoding]::ASCII)
            $rejected = @(& cmd.exe /d /c $badLauncher 2>&1)
            $rejectedExit = $LASTEXITCODE
            $rejected | ForEach-Object { Write-Host $_ }
            if ($rejectedExit -eq 0 -or ($rejected -match 'PILOT EXECUTION BOOTSTRAP VERIFIED:') -or
                -not ($rejected -match 'Pilot execution installer SHA256 mismatch')) {
              throw 'Incorrect pilot execution installer hash did not block execution'
            }
            Write-Host 'PILOT EXECUTION NEGATIVE HASH CHECK PASSED: nothing executed.'
          } finally {
            Remove-Item -LiteralPath $badLauncher -Force -ErrorAction SilentlyContinue
          }
          exit 0
      - name: Verify preparation pilot launcher SHA256 and block an incorrect hash before installer execution
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          ARABICPRM_PILOT_VERIFY_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = "$pwd/research/prm_arabic_english/verify_recovery_pilot20_windows_v1.cmd"
          $verified = @(& cmd.exe /d /c $launcher 2>&1)
          $verifiedExit = $LASTEXITCODE
          $verified | ForEach-Object { Write-Host $_ }
          if ($verifiedExit -ne 0 -or -not ($verified -match 'PILOT BOOTSTRAP VERIFIED:')) {
            throw "Pilot bootstrap exact-hash verification failed: $verifiedExit"
          }
          $badLauncher = Join-Path $env:TEMP ("ArabicPRM-pilot-bad-hash-" + [guid]::NewGuid().ToString('N') + '.cmd')
          try {
            $original = [IO.File]::ReadAllText($launcher)
            $digest = [regex]::Match($original, '[0-9a-f]{64}').Value
            if (-not $digest) { throw 'Missing pinned pilot installer hash' }
            [IO.File]::WriteAllText($badLauncher, $original.Replace($digest, ('0' * 64)), [Text.Encoding]::ASCII)
            $rejected = @(& cmd.exe /d /c $badLauncher 2>&1)
            $rejectedExit = $LASTEXITCODE
            $rejected | ForEach-Object { Write-Host $_ }
            if ($rejectedExit -eq 0 -or ($rejected -match 'PILOT BOOTSTRAP VERIFIED:') -or
                -not ($rejected -match 'Pilot preparation installer SHA256 mismatch')) {
              throw 'Incorrect pilot installer hash did not block execution'
            }
            Write-Host 'PILOT NEGATIVE HASH CHECK PASSED: nothing executed.'
          } finally {
            Remove-Item -LiteralPath $badLauncher -Force -ErrorAction SilentlyContinue
          }
          exit 0
      - name: Package pinned recovery from raw Git blobs without inference or changing historical state
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          PINNED_RECOVERY_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_v2_recovery_windows.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_RECOVERY_SHA" -PackageOnly
          if ($LASTEXITCODE -ne 0) { throw "Native offline recovery packaging failed: $LASTEXITCODE" }
      - name: Verify recovery bootstrap pin and reject an incorrect hash before execution
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          ARABICPRM_RECOVERY_VERIFY_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = "$pwd/research/prm_arabic_english/prepare_v2_recovery_windows.cmd"
          $verified = @(& cmd.exe /d /c $launcher 2>&1)
          $verifiedExit = $LASTEXITCODE
          $verified | ForEach-Object { Write-Host $_ }
          if ($verifiedExit -ne 0 -or -not ($verified -match 'RECOVERY BOOTSTRAP VERIFIED:')) {
            throw "Recovery bootstrap exact-hash verification failed: $verifiedExit"
          }
          $badLauncher = Join-Path $env:TEMP ("ArabicPRM-recovery-bad-hash-" + [guid]::NewGuid().ToString('N') + '.cmd')
          try {
            $original = [IO.File]::ReadAllText($launcher)
            $digest = [regex]::Match($original, '[0-9a-f]{64}').Value
            if (-not $digest) { throw 'Missing pinned recovery installer hash' }
            [IO.File]::WriteAllText($badLauncher, $original.Replace($digest, ('0' * 64)), [Text.Encoding]::ASCII)
            $rejected = @(& cmd.exe /d /c $badLauncher 2>&1)
            $rejectedExit = $LASTEXITCODE
            $rejected | ForEach-Object { Write-Host $_ }
            if ($rejectedExit -eq 0 -or ($rejected -match 'RECOVERY BOOTSTRAP VERIFIED:') -or
                -not ($rejected -match 'Recovery installer SHA256 mismatch')) {
              throw 'Incorrect recovery installer hash was not rejected before execution'
            }
            Write-Host 'RECOVERY NEGATIVE HASH CHECK PASSED: nothing executed.'
          } finally {
            Remove-Item -LiteralPath $badLauncher -Force -ErrorAction SilentlyContinue
          }
          exit 0
      - name: Run Windows launcher frozen-source preflight without Ollama
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/resume_v2_windows.ps1 -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows preflight failed: $LASTEXITCODE" }
      - name: Verify the one-click bootstrap downloads its exact pinned installer
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        env:
          ARABICPRM_BOOTSTRAP_VERIFY_ONLY: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = "$pwd/research/prm_arabic_english/activate_v2_unattended_windows.cmd"
          $verified = @(& cmd.exe /d /c $launcher 2>&1)
          $verifiedExit = $LASTEXITCODE
          $verified | ForEach-Object { Write-Host $_ }
          if ($verifiedExit -ne 0 -or -not ($verified -match 'BOOTSTRAP VERIFIED:')) {
            throw "Pinned bootstrap verification did not succeed: $verifiedExit"
          }
          $badHashLauncher = Join-Path $env:TEMP ("ArabicPRM-bad-hash-" + [guid]::NewGuid().ToString('N') + '.cmd')
          try {
            $original = [IO.File]::ReadAllText($launcher)
            $digest = [regex]::Match($original, '[0-9a-f]{64}').Value
            if (-not $digest) { throw 'Missing pinned installer hash' }
            $bad = $original.Replace($digest, ('0' * 64))
            [IO.File]::WriteAllText($badHashLauncher, $bad, [Text.Encoding]::ASCII)
            $rejected = @(& cmd.exe /d /c $badHashLauncher 2>&1)
            $rejectedExit = $LASTEXITCODE
            $rejected | ForEach-Object { Write-Host $_ }
            if ($rejectedExit -eq 0 -or ($rejected -match 'BOOTSTRAP VERIFIED:') -or
                -not ($rejected -match 'Installer hash verification failed')) {
              throw "Bootstrap did not reject the incorrect hash with a failing exit"
            }
            Write-Host 'BOOTSTRAP NEGATIVE CHECK PASSED: incorrect hash rejected; nothing executed.'
          } finally {
            Remove-Item -LiteralPath $badHashLauncher -Force -ErrorAction SilentlyContinue
          }
          # The deliberate negative test returned 1; all assertions above passed.
          exit 0
      - name: Install and execute a native Windows scheduled task in offline mode
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production' && github.event_name == 'workflow_dispatch' && inputs.legacy_scheduled_task_checks == true
        shell: pwsh
        env:
          PINNED_RESEARCH_SHA: ${{ github.sha }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_v2_unattended_windows.ps1 -RepoRoot "$pwd" -PinnedCommit "$env:PINNED_RESEARCH_SHA" -TestOnly
          if ($LASTEXITCODE -ne 0) { throw "Native unattended installation failed: $LASTEXITCODE" }
      - name: Reproduce legacy CRLF staging and preserve Batch09 checkpoints through native installation
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production' && github.event_name == 'workflow_dispatch' && inputs.legacy_scheduled_task_checks == true
        shell: pwsh
        env:
          PINNED_RESEARCH_SHA: ${{ github.sha }}
        run: |
          $fixtureRoot = Join-Path $env:TEMP ("ArabicPRM-legacy-fixture-" + [guid]::NewGuid().ToString('N'))
          try {
            & python research/prm_arabic_english/windows_preflight_fixture.py --prepare $fixtureRoot --repository-root "$pwd"
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare disposable legacy fixture' }
            & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/install_v2_unattended_windows.ps1 -RepoRoot $fixtureRoot -PinnedCommit "$env:PINNED_RESEARCH_SHA" -TestOnly
            if ($LASTEXITCODE -ne 0) { throw "Legacy fixture native installation failed: $LASTEXITCODE" }
            & python research/prm_arabic_english/windows_preflight_fixture.py --verify $fixtureRoot
            if ($LASTEXITCODE -ne 0) { throw 'Legacy files or retry ledgers changed' }
          } finally {
            # Only this uniquely named, newly created offline fixture is removed.
            Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

