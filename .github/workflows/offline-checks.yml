name: Offline research checks

on:
  push:
    paths:
      - "research/prm_arabic_english/**"
      - "scripts/check_reproducibility.py"
      - ".github/workflows/offline-checks.yml"
  pull_request:
    paths:
      - "research/prm_arabic_english/**"
      - "scripts/check_reproducibility.py"
      - ".github/workflows/offline-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            research/prm_arabic_english
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python scripts/check_reproducibility.py
      - name: Parse the Windows launcher without starting inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$pwd/research/prm_arabic_english/resume_v2_windows.ps1",
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run Windows launcher frozen-source preflight without Ollama
        if: runner.os == 'Windows' && github.ref == 'refs/heads/research/arabicprm-v2-production'
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File research/prm_arabic_english/resume_v2_windows.ps1 -PreflightOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows preflight failed: $LASTEXITCODE" }

