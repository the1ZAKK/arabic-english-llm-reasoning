name: ArabicPRM-T v2 local Ollama drafts (human QC required)
on:
  workflow_dispatch:
    inputs:
      start_batch:
        description: "First batch (09 through 32)"
        required: true
        default: "9"
      end_batch:
        description: "Last batch (09 through 32)"
        required: true
        default: "32"
permissions:
  contents: read
concurrency:
  group: arabicprm-local-translation
  cancel-in-progress: false
jobs:
  translate-local:
    # Inference is manual only, on a trusted machine with Ollama already running.
    runs-on: [self-hosted, linux, arabicprm-translation]
    timeout-minutes: 350
    env:
      START_BATCH: ${{ inputs.start_batch }}
      END_BATCH: ${{ inputs.end_batch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: false
          sparse-checkout: |
            .github
            scripts
            research/prm_arabic_english
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Resume frozen batches and produce pending bilingual review artifacts
        run: |
          python3 research/prm_arabic_english/resume_v2_local.py \
            --staging-root frozen_staging --output-root translated_drafts \
            --review-root review_artifacts \
            --start "$START_BATCH" --end "$END_BATCH" \
            --model qwen3:4b --base-url http://127.0.0.1:11434/v1
      - name: Archive checkpoints, failures and pending human review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabicprm-v2-ollama-drafts-pending-review
          path: |
            translated_drafts/
            review_artifacts/
          if-no-files-found: warn
