name: ArabicPRM-T v2 source subset

on:
  push:
    branches:
      - research/arabicprm-t-v2-production
    paths:
      - ".github/workflows/arabicprm-t-v2-source-subset.yml"
      - "research/prm_arabic_english/select_arabicprm_t_v2_source.py"
      - "research/prm_arabic_english/test_select_arabicprm_t_v2_source.py"
      - "research/prm_arabic_english/prm800k_production_sample.py"
      - "research/prm_arabic_english/source_quarantine.json"
      - "research/prm_arabic_english/translation_batches/**/source_lock.json"
      - "research/prm_arabic_english/translation_batches/prm800k_qc24/problem_split_lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: research/prm_arabic_english
      PRM800K_REVISION: 7ecc794703b2877f63226f2477a49b34f9b25163
      PRM800K_SHA256: 1110237feeb51d1bc200cb37b8f965cfdc1036eac7d506094049366fe7dc1089
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Run selector tests
        run: |
          python -m unittest research.prm_arabic_english.test_select_arabicprm_t_v2_source -v
          python -m unittest research.prm_arabic_english.test_prm800k_production_sample -v

      - name: Fetch and verify pinned PRM800K shard
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git lfs install
          git clone --filter=blob:none https://github.com/openai/prm800k.git prm800k-source
          git -C prm800k-source checkout "$PRM800K_REVISION"
          git -C prm800k-source lfs pull --include="prm800k/data/phase2_train.jsonl" --exclude=""
          echo "$PRM800K_SHA256  prm800k-source/prm800k/data/phase2_train.jsonl" | sha256sum -c -

      - name: Reconstruct verified 1000-problem source pool
        run: |
          python research/prm_arabic_english/prm800k_production_sample.py             --input prm800k-source/prm800k/data/phase2_train.jsonl             --expected-sha256 "$PRM800K_SHA256"             --output-dir source_pool             --max-problems 1000             --seed 42             --dev-fraction 0.2             --split-lock research/prm_arabic_english/translation_batches/prm800k_qc24/problem_split_lock.json

      - name: Select balanced paired v2 source
        run: |
          python research/prm_arabic_english/select_arabicprm_t_v2_source.py             --source-dir source_pool             --output-dir arabicprm_t_v2_source             --train-problem-pairs 80             --dev-problem-pairs 20             --seed 42             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc12/source_lock.json             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24/source_lock.json             --exclude-source-lock research/prm_arabic_english/translation_batches/prm800k_qc24_batch03_r1/source_lock.json

      - name: Emit compact selection summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("arabicprm_t_v2_source/manifest.json").read_text(encoding="utf-8"))
          summary = {
              "source_full_sha256": manifest["source_full_sha256"],
              "selection_method": manifest["selection_method"],
              "config": manifest["config"],
              "problem_overlap": manifest["problem_overlap"],
              "achieved": manifest["achieved"],
              "train": {k: v for k, v in manifest["summary"]["train"].items()
                        if k not in ("record_ids", "problem_ids")},
              "dev": {k: v for k, v in manifest["summary"]["dev"].items()
                      if k not in ("record_ids", "problem_ids")},
              "global_mgsm_used": manifest["global_mgsm_used"],
              "translation_performed": manifest["translation_performed"],
              "human_qc_performed": manifest["human_qc_performed"],
              "training_performed": manifest["training_performed"],
          }
          Path("arabicprm_t_v2_selection_summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print("ARABICPRM_T_V2_SELECTION=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Upload selected source and translation queue
        uses: actions/upload-artifact@v4
        with:
          name: arabicprm-t-v2-source-200
          path: |
            arabicprm_t_v2_source/
            arabicprm_t_v2_selection_summary.json
          if-no-files-found: error
